{% extends 'base/base.html' %}

{% block title %}404 Not Found - Page Doesn't Exist{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-body text-center p-5">
                    <div class="mb-4">
                        <i class="fas fa-map-signs text-warning fa-5x"></i>
                    </div>
                    <h1 class="display-4 mb-3">404 Page Not Found</h1>
                    <p class="lead mb-4">The page you're looking for doesn't exist or has been moved.</p>
                    <p class="mb-4">Requested URL: {{ request_path }}</p>
                    <div class="mt-5">
                        <a href="/" class="btn btn-primary btn-lg">
                            <i class="fas fa-home me-2"></i>Go to Home
                        </a>
                        <button onclick="history.back()" class="btn btn-outline-secondary btn-lg ms-3">
                            <i class="fas fa-arrow-left me-2"></i>Go Back
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
